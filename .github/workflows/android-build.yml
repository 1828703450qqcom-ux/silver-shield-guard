name: Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon
